name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    env:
      PORT: 4000
      NODE_ENV: test
      MONGODB_URL: mongodb://127.0.0.1:27017/skillswap?replicaSet=rs0&directConnection=true
      MONGODB_URI: mongodb://127.0.0.1:27017/skillswap?replicaSet=rs0&directConnection=true
      JWT_SECRET: ci-test-jwt-secret-min-32-chars-long-env-0123456789
      COOKIE_SECRET: ci-test-jwt-secret-min-32-chars-long-env-0123456789
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Start MongoDB 7 Replica Set Container
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          for i in {1..30}; do
            docker exec mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' 2>/dev/null | grep -q 1 && break
            sleep 1
          done
          docker exec mongo mongosh --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          for i in {1..30}; do
            docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true && break
            sleep 1
          done

      - name: Install dependencies (root, server, client)
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix client ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Configure CI Environment
        run: |
          cat <<EOF > server/.env
          PORT=4000
          NODE_ENV=test
          MONGODB_URL=mongodb://127.0.0.1:27017/skillswap?replicaSet=rs0&directConnection=true
          JWT_SECRET=ci-test-jwt-secret-min-32-chars-long-env-0123456789
          COOKIE_SECRET=ci-test-jwt-secret-min-32-chars-long-env-0123456789
          EOF

      - name: Lint (Server & Client)
        run: npm run lint

      - name: Unit Tests (Server & Client)
        run: npm test

      - name: Client Build
        run: npm run build

  integration:
    name: End-to-End Integration & Check Suite
    needs: quality
    runs-on: ubuntu-latest
    env:
      PORT: 4000
      NODE_ENV: test
      MONGODB_URL: mongodb://127.0.0.1:27017/skillswap?replicaSet=rs0&directConnection=true
      MONGODB_URI: mongodb://127.0.0.1:27017/skillswap?replicaSet=rs0&directConnection=true
      JWT_SECRET: ci-test-jwt-secret-min-32-chars-long-env-0123456789
      COOKIE_SECRET: ci-test-jwt-secret-min-32-chars-long-env-0123456789
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Start MongoDB 7 Replica Set Container
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          for i in {1..30}; do
            docker exec mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' 2>/dev/null | grep -q 1 && break
            sleep 1
          done
          docker exec mongo mongosh --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          for i in {1..30}; do
            docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true && break
            sleep 1
          done

      - name: Install dependencies (root, server, client)
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix client ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build client production assets
        run: npm run build

      - name: Configure CI Environment
        run: |
          cat <<EOF > server/.env
          PORT=4000
          NODE_ENV=test
          MONGODB_URL=mongodb://127.0.0.1:27017/skillswap?replicaSet=rs0&directConnection=true
          JWT_SECRET=ci-test-jwt-secret-min-32-chars-long-env-0123456789
          COOKIE_SECRET=ci-test-jwt-secret-min-32-chars-long-env-0123456789
          EOF

      - name: Push Prisma schema to MongoDB
        run: npm --prefix server exec -- prisma db push --skip-generate --schema=prisma/schema.prisma

      - name: Seed Database (Baseline Data & Avatars)
        run: |
          node server/scripts/migrate-sqlite-to-mongo.mjs --apply
          node server/scripts/migrate-avatars-to-db.mjs --apply

      - name: Run Server Check Suite (run-checks.mjs)
        run: npm run check

      - name: Run Production Smoke Check (prod-smoke-check.mjs)
        run: node server/scripts/prod-smoke-check.mjs

      - name: Start Backend Server & Run Foundation Checks
        run: |
          node server/src/index.js &
          SERVER_PID=$!
          sleep 3
          node server/scripts/foundation-check.mjs
          kill $SERVER_PID

      - name: Run Client Smoke & Feature Verification (Vite Preview + Express)
        run: |
          node server/src/index.js &
          SERVER_PID=$!
          npm --prefix client run preview &
          CLIENT_PID=$!
          sleep 4
          node client/scripts/smoke-check.mjs
          node client/scripts/m4a-check.mjs
          node client/scripts/m4b-check.mjs
          kill $CLIENT_PID
          kill $SERVER_PID
        env:
          PORT: 4000
          CLIENT_URL: http://localhost:5173

